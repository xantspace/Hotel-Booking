{% extends "admin/base.html" %}

{% block title %}{{ title }} | {{ site_title|default:_('Django site admin') }}{% endblock %}

{% block branding %}
<h1 id="site-name"><a href="{% url 'admin:index' %}">{{ site_header|default:_('Django administration') }}</a></h1>
{% endblock %}

{% block nav-global %}
<!-- Mobile Sidebar Toggle -->
<button id="nav-toggle" class="sidebar-toggle" aria-label="Toggle Sidebar">
    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
</button>
{% endblock %}

{% block extrastyle %}
<style>
    /* Global Styles */
    :root {
        --primary-color: #0d5c5c;
        --secondary-color: #10b981;
        --bg-color: #f3f4f6;
    }

    body {
        background-color: var(--bg-color);
    }

    /* Layout: Sidebar on Right */
    @media (min-width: 769px) {
        #main {
            display: flex !important;
            flex-direction: row-reverse !important; /* Sidebar Right, Content Left */
            align-items: flex-start;
        }

        #nav-sidebar {
            width: 280px;
            min-width: 280px;
            border-right: none !important;
            border-left: 1px solid #e5e7eb;
            background: white;
            height: 100vh;
            position: sticky;
            top: 0;
        }

        /* Adjust content to take remaining space */
        .dashboard #content, #content {
            flex-grow: 1;
            width: auto;
            max-width: calc(100% - 280px); /* Ensure it doesn't overflow */
            padding: 20px !important;
        }
    }

    /* Reduce Padding in Boxes (Global) */
    .module, .card, .stat-card, .dashboard-section {
        padding: 15px !important;
        margin-bottom: 15px !important;
        border-radius: 8px !important;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        border: 1px solid #e5e7eb;
    }
    
    .module h2, .module caption {
        padding: 8px 12px !important;
        font-size: 14px !important;
    }

    /* Mobile Responsive Styles */
    @media (max-width: 768px) {
        /* Sidebar hidden by default on mobile */
        #nav-sidebar {
            position: fixed;
            top: 0;
            right: -300px; /* Hidden off-screen right */
            width: 280px;
            height: 100vh;
            background: white;
            z-index: 1000;
            transition: right 0.3s ease;
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
            border-left: 1px solid #e5e7eb;
            display: block !important; /* Ensure it's not hidden by Django defaults */
        }
        
        #nav-sidebar.open {
            right: 0;
        }

        /* Overlay when sidebar matches */
        #sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        #sidebar-overlay.active {
            display: block;
        }

        #content {
            width: 100% !important;
            padding: 10px !important;
        }
        
        /* Stats Grid */
        .dashboard-stats {
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 10px !important;
        }
        
        .stat-value {
            font-size: 20px !important;
        }
    }

    /* Custom Toggle Button */
    .sidebar-toggle {
        display: none;
        background: transparent;
        border: none;
        color: white;
        cursor: pointer;
        padding: 5px;
        margin-left: auto;
    }
    
    @media (max-width: 768px) {
        .sidebar-toggle {
            display: block;
        }
        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px !important;
        }
        .branding {
            flex-grow: 1;
        }
    }

    /* Branding Override */
    #header {
        background: var(--primary-color) !important;
        color: white !important;
    }
    #branding h1 {
        color: white !important;
    }
    div.breadcrumbs {
        background: white;
        padding: 10px 20px;
        border-bottom: 1px solid #e5e7eb;
    }

    /* Button Colors */
    .button.default, input[type=submit], .submit-row input.default {
        background: var(--primary-color) !important;
    }
    
    /* Hide Django's default recent actions if sidebar handles it or to clean up */
    #content-related {
        display: none; /* Often redundant with sidebar */
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const toggleBtn = document.getElementById('nav-toggle');
        const sidebar = document.getElementById('nav-sidebar');
        const main = document.getElementById('main');
        
        // Create overlay
        const overlay = document.createElement('div');
        overlay.id = 'sidebar-overlay';
        document.body.appendChild(overlay);

        if (toggleBtn && sidebar) {
            toggleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                sidebar.classList.toggle('open');
                overlay.classList.toggle('active');
            });
            
            overlay.addEventListener('click', function() {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            });
        }
    });
</script>
{% endblock %}
