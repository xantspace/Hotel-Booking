services:
  - type: web
    name: west-swiss-hotel
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn west_swiss_hotel.wsgi
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DJANGO_SETTINGS_MODULE
        value: west_swiss_hotel.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*" # Update this to your Render URL after creation
      - key: DATABASE_URL
        fromDatabase:
          name: west-swiss-db
          property: connectionString

databases:
  - name: west-swiss-db
    plan: free
